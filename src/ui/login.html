<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSM — Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
      background:
        radial-gradient(ellipse 60% 50% at 50% 38%, rgba(16,185,129,.09), transparent 70%),
        linear-gradient(rgba(42,68,112,.14) 1px, transparent 1px) 0 0 / 32px 32px,
        linear-gradient(90deg, rgba(42,68,112,.14) 1px, transparent 1px) 0 0 / 32px 32px,
        var(--bg);
    }
    .login {
      width: 100%;
      max-width: 340px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 2px solid var(--green);
      border-radius: var(--rl);
      padding: 32px 28px 28px;
      box-shadow: 0 24px 60px rgba(0,0,0,.45);
      animation: rise .5s cubic-bezier(.2,.8,.2,1) both;
    }
    .login-mark {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 26px;
      animation: rise .5s .08s cubic-bezier(.2,.8,.2,1) both;
    }
    .login-hex {
      font-size: 30px;
      line-height: 1;
      color: var(--green);
      text-shadow: 0 0 18px var(--green-glow);
    }
    .login-title { font-family: var(--ui); font-weight: 700; font-size: 22px; letter-spacing: .12em; }
    .login-sub   { font-family: var(--mono); font-size: 11px; color: var(--text-muted); letter-spacing: .04em; }
    .login form  { display: flex; flex-direction: column; gap: 14px; animation: rise .5s .16s cubic-bezier(.2,.8,.2,1) both; }
    .login label { font-family: var(--ui); font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--text-dim); }
    .login input {
      width: 100%;
      margin-top: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text);
      padding: 10px 12px;
      font-family: var(--mono);
      font-size: 14px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .login input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-dim); }
    .login button { padding: 10px 16px; font-size: 14px; }
    .login-error {
      font-size: 12px;
      color: var(--red);
      background: var(--red-dim);
      border-radius: var(--r);
      padding: 7px 10px;
    }
    .login.shake { animation: shake .35s; }
    @keyframes rise  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    @media (prefers-reduced-motion: reduce) { .login, .login-mark, .login form { animation: none; } }
  </style>
</head>
<body>
  <main class="login" id="login">
    <div class="login-mark">
      <span class="login-hex">⬡</span>
      <div>
        <div class="login-title">MSM</div>
        <div class="login-sub">minecraft server manager</div>
      </div>
    </div>
    <form id="login-form">
      <label for="password">PASSWORD
        <input id="password" type="password" autocomplete="current-password" required autofocus>
      </label>
      <div id="login-error" class="login-error hidden"></div>
      <button id="login-btn" type="submit" class="btn-primary">Log in</button>
    </form>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const btn   = document.getElementById('login-btn')
      const errEl = document.getElementById('login-error')
      const card  = document.getElementById('login')
      btn.disabled = true
      btn.textContent = 'Checking…'
      errEl.classList.add('hidden')
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value }),
        })
        if (res.ok) { location.href = '/'; return }
        const json = await res.json().catch(() => ({}))
        errEl.textContent = json.error || 'Login failed'
      } catch {
        errEl.textContent = 'Could not reach MSM'
      }
      errEl.classList.remove('hidden')
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake')
      btn.disabled = false
      btn.textContent = 'Log in'
      document.getElementById('password').select()
    })
  </script>
</body>
</html>
