services:
  msm:
    build: .
    image: minecraft-server-manager:latest
    container_name: msm
    restart: unless-stopped
    # Give running servers time to save the world on `docker compose down`
    stop_grace_period: 3m30s
    ports:
      - "8080:8080"     # web dashboard
      - "25565:25565"   # Minecraft — add a line for each other port your instances use
    volumes:
      - msm-data:/data
    labels:
      # Homepage (gethomepage.dev) auto-discovery — remove if you don't use it
      - homepage.group=Games
      - homepage.name=Minecraft
      - homepage.icon=minecraft.png
      - homepage.href=http://localhost:8080
      - homepage.description=Minecraft Server Manager
      - homepage.widget.type=customapi
      - homepage.widget.url=http://msm:8080/api/homepage
      - homepage.widget.mappings[0].label=Status
      - homepage.widget.mappings[0].field=status
      - homepage.widget.mappings[1].label=Players
      - homepage.widget.mappings[1].field=players
      - homepage.widget.mappings[2].label=TPS
      - homepage.widget.mappings[2].field=tps
      - homepage.widget.mappings[2].format=float
      - homepage.widget.mappings[3].label=RAM
      - homepage.widget.mappings[3].field=ram_mb
      - homepage.widget.mappings[3].format=number
      - homepage.widget.mappings[3].suffix=MB

volumes:
  msm-data:
